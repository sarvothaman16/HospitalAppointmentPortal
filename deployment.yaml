apiVersion: apps/v1
kind: Deployment

metadata:
  name: hospital-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: hospital-portal

  template:
    metadata:
      labels:
        app: hospital-portal

    spec:
      containers:
        - name: hospital-container
          image: sarvotham2006/hospital-appointment-portal:v1
          ports:
            - containerPort: 80
